server:
  port: ${PORT:8084}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: audit-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bankmanagement}
    username: ${DB_USERNAME:audit_svc}
    password: ${DB_PASSWORD:change-me-db}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      schema: audit
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_schema: audit
  flyway:
    schemas: audit
    default-schema: audit
    create-schemas: true
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:bankmanagement}
    password: ${RABBITMQ_PASSWORD:change-me-rabbit}
    listener:
      simple:
        default-requeue-rejected: false   # after retries, send to the dead-letter queue
        concurrency: 1
        max-concurrency: 4
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1s
          multiplier: 2
          max-interval: 30s
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://auth.bankmanagement.local}
          audiences: bank-management

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:change-me-eureka@localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"
