server:
  port: ${PORT:8761}

spring:
  application:
    name: discovery-server
  config:
    # Local runs (IDE / mvn spring-boot:run) read secrets from the git-ignored .env at the project root.
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  security:
    user:
      name: ${EUREKA_USERNAME}
      password: ${EUREKA_PASSWORD}

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
